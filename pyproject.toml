[tool.poetry]
name = "runitup-turbo"
version = "0.1.0"
description = "Merge real-time and historical data into a backtesting analysis, providing insights into how strategies would have performed in the past and how they might fare in the current market for both crypto and stocks."
authors = ["tyrovirtuosso <tyrovirtuosso@proton.me>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
termcolor = "^2.3.0"
pexpect = "^4.8.0"
python-dotenv = "^1.0.0"
tqdm = "^4.66.1"
requests = "^2.31.0"
pandas = "^2.1.1"
loguru = "^0.7.2"
alpaca-py = "^0.12.0"
halo = "^0.0.31"
pandas-market-calendars = "^4.3.1"
pyyaml = "^6.0.1"
mysql-connector-python = "^8.1.0"
psycopg2 = "^2.9.9"
pyodbc= "^5.0.1"
azure-identity = "^1.15.0"
sqlalchemy = "^2.0.22"
tenacity = "^8.2.3"


[tool.poetry.group.dev.dependencies]
pre-commit = "^3.5.0"
black = "^23.10.0"
isort = "^5.12.0"
ruff = "^0.1.1"

[tool.black]
line-length = 99
target-version = ['py311']
exclude = '''
/(
  | migrations
)/
'''

[tool.ruff]
line-length = 99
select = ["F", "E", "W", "Q", "I001"]
ignore = ["E501"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".venv",
    "**/migrations/*.py",
]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main"
]
exclude = [
    "**/migrations/*.py"
]
enable_error_code = [
    "truthy-bool",
    "truthy-iterable",
    "redundant-expr",
    "unused-awaitable",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-self",
]
allow_redefinition = false
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
explicit_package_bases = true
ignore_errors = false
ignore_missing_imports = true
implicit_reexport = false
local_partial_types = true
strict_equality = true
strict_optional = true
show_error_codes = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
warn_no_return = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
